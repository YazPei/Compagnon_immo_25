groups:
- name: api_performance
  rules:
  - alert: HighErrorRate
    expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High error rate detected"
      description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

  - alert: HighLatency
    expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High latency detected"
      description: "95th percentile latency is {{ $value }}s"

  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Service is down"
      description: "{{ $labels.instance }} has been down for more than 1 minute"

- name: ml_model_performance
  rules:
  - alert: ModelDrift
    expr: model_drift_score > 0.3
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: "Model drift detected"
      description: "Model drift score is {{ $value }}, consider retraining"

  - alert: LowModelConfidence
    expr: avg_over_time(model_prediction_confidence[1h]) < 0.7
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: "Low model confidence"
      description: "Average model confidence is {{ $value | humanizePercentage }}"

  - alert: HighPredictionLatency
    expr: histogram_quantile(0.95, rate(model_prediction_duration_seconds_bucket[5m])) > 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High prediction latency"
      description: "95th percentile prediction time is {{ $value }}s"

- name: data_quality
  rules:
  - alert: StaleData
    expr: (time() - data_freshness_timestamp) > 86400
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Data is stale"
      description: "Data hasn't been updated for more than 24 hours"

  - alert: DataQualityIssue
    expr: data_quality_score < 0.8
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Data quality degraded"
      description: "Data quality score is {{ $value | humanizePercentage }}"

- name: infrastructure
  rules:
  - alert: HighMemoryUsage
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage"
      description: "Memory usage is {{ $value | humanizePercentage }}"

  - alert: HighCPUUsage
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage"
      description: "CPU usage is {{ $value | humanizePercentage }}"
