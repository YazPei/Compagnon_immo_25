services:
  # Base de données PostgreSQL pour Airflow
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ml_net
    profiles: ["airflow"]

  # Redis pour les tâches en arrière-plan
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Port hôte changé pour éviter le conflit
    networks:
      - ml_net

  # MLflow pour le suivi des expériences
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.1
    ports:
      - "5050:5050"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5050
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - ml_net
    profiles: ["regression", "series", "test"]

  # Airflow Webserver
  airflow-webserver:
    build:
      context: ./SERVICES/airflow
      dockerfile: Dockerfile.airflow
    command: >
      bash -c "
        airflow db upgrade &&
        airflow webserver --port 8081
      "
    ports:
      - "8081:8081"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_UID: 50000
      MLFLOW_TRACKING_URI: http://mlflow:5050
    volumes:
      - ./SERVICES/airflow:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs
      - .:/opt/airflow/repo
      - ./data:/opt/airflow/data
      - ./exports:/opt/airflow/exports
      - ./SERVICES:/opt/airflow/services
    depends_on:
      - postgres-airflow
      - redis
      - mlflow
    networks:
      - ml_net
    profiles: ["airflow"]

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ./SERVICES/airflow
      dockerfile: Dockerfile.airflow
    command: airflow scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: 50000
      MLFLOW_TRACKING_URI: http://mlflow:5050
    volumes:
      - ./SERVICES/airflow:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs
      - .:/opt/airflow/repo
      - ./data:/opt/airflow/data
      - ./exports:/opt/airflow/exports
      - ./SERVICES:/opt/airflow/services
    depends_on:
      - postgres-airflow
      - redis
      - mlflow
    networks:
      - ml_net
    profiles: ["airflow"]

  # API FastAPI
  api:
    build:
      context: ./SERVICES/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5050
      - ENVIRONMENT=development
    depends_on:
      - mlflow
    networks:
      - ml_net
    profiles: ["regression", "series", "test"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service DVC pour les pipelines de données
  dvc:
    build:
      context: ./SERVICES/dvc
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./exports:/app/exports
    working_dir: /app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5050
      - DVC_NO_ANALYTICS=1
    networks:
      - ml_net
    profiles: ["dvc"]

  # Service de test automatisé
  api-test:
    build:
      context: ./SERVICES/tests
      dockerfile: Dockerfile
    user: root
    volumes:
      - ./SERVICES/api:/app/app
      - ./params.yaml:/app/params.yaml
      - ./SERVICES/tests:/app/app/api/tests
    working_dir: /app
    environment:
      - API_BASE_URL=http://api:8000/api/v1
      - MLFLOW_TRACKING_URI=http://mlflow:5050
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_healthy
      mlflow:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - ml_net
    command: bash -c "cd /app && ls -la app/api/tests && python -m pytest app/api/tests -v"
    profiles: ["test", "regression", "series"]

  # Service CI pour tests et linting
  ci:
    build:
      context: ./SERVICES/tests
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    networks:
      - ml_net
    command: >
      bash -c "
        python -m pytest SERVICES/tests -v &&
        python -m flake8 SERVICES/api --max-line-length=88 --ignore=E203,W503
      "
    profiles: ["ci"]

  # Prometheus pour la collecte de métriques (désactivé - conflit avec le service monitoring)
  # prometheus:
  #   image: prom/prometheus:v2.45.0
  #   user: "${UID:-1000}:${GID:-1000}"
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./SERVICES/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/etc/prometheus/console_libraries'
  #     - '--web.console.templates=/etc/prometheus/consoles'
  #     - '--storage.tsdb.retention.time=200h'
  #     - '--web.enable-lifecycle'
  #   networks:
  #     - ml_net
  #   profiles: ["monitoring"]

  # Grafana pour la visualisation des métriques (désactivé - conflit avec le service monitoring)
  # grafana:
  #   image: grafana/grafana:10.1.0
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./SERVICES/monitoring/grafana/provisioning:/etc/grafana/provisioning
  #     - ./SERVICES/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=admin
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   depends_on:
  #     - prometheus
  #   networks:
  #     - ml_net
  #   profiles: ["monitoring"]

  # --------- Pipeline de lancement ----------
  run_full:
    build:
      context: ./SERVICES/dvc
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    tty: true
    stdin_open: true
    env_file:
      - .env
    environment:
      - RUN_MODE=full
    networks:
      - ml_net

  # --------- Préparation des données ----------
  fusion_geo:
    build:
      context: ./SERVICES/fusion
      dockerfile: Dockerfile.fusion
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ./SERVICES:/app/services
    env_file:
      - .env
    networks:
      - ml_net
    command: ["bash", "-lc", "python services/fusion/fusion.py"]
    profiles: ["regression", "series"]

  preprocessing:
    build:
      context: ./SERVICES/preprocessing
      dockerfile: Dockerfile.preprocessing
    image: compagnon_immo_25-preprocessing
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./SERVICES/preprocessing:/app/services/preprocessing
    env_file:
      - .env
    command: ["python","services/preprocessing/preprocessing.py",
          "--input-path","/app/data",
          "--output-path","/app/data"]
    networks:
      - ml_net
    profiles: ["regression", "series"]

  clustering:
    build:
      context: ./SERVICES/clustering
      dockerfile: Dockerfile.clustering
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./SERVICES:/app/services
    env_file:
      - .env
    networks:
      - ml_net
    command: ["python","services/clustering/Clustering.py",
          "--input-path","/app/data/train_clean.csv",
          "--output-path1","/app/data/df_cluster.csv",
          "--output-path2","/app/data/df_sales_clean_ST.csv"]
    profiles: ["regression", "series"]

  encode:
    build:
      context: ./SERVICES/encoding
      dockerfile: Dockerfile.encoding.REG
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./SERVICES/encoding:/app/services/encoding
      - ./data:/app/data
      - ./exports:/app/exports
    command: ["python", "/app/services/encoding/encoding.py"]
    env_file:
      - .env
    networks:
      - ml_net
    profiles: ["regression"]

  # --------- Régression ----------
  train_lgbm:
    build:
      context: ./SERVICES/train_lgbm
      dockerfile: Dockerfile.lgbm.REG
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./SERVICES/train_lgbm:/app/services/train_lgbm
      - ./data:/app/data
      - ./exports:/app/exports
    command: ["python", "/app/services/train_lgbm/train_lgbm.py"]
    env_file:
      - .env
    networks:
      - ml_net
    profiles: ["regression"]

  analyse:
    build:
      context: ./SERVICES/analyse
      dockerfile: Dockerfile.analyse.REG
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./SERVICES/analyse:/app/services/analyse
      - ./exports:/app/exports
      - ./data:/app/data
    command: ["python", "/app/services/analyse/analyse.py"]
    env_file:
      - .env
    networks:
      - ml_net
    profiles: ["regression"]

  # --------- Séries Temporelles ----------
  split:
    build:
      context: ./SERVICES/series_temporelles/1_SPLIT
      dockerfile: Dockerfile.split.ST
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./exports:/app/exports
      - ./data:/app/data
      - ./SERVICES:/app/services
    entrypoint: ["python", "/app/services/series_temporelles/1_SPLIT/load_split.py"]
    env_file:
      - .env
    environment:
      - RUN_MODE=full
      - ST_SUFFIX=${ST_SUFFIX:-q12}
    networks:
      - ml_net
    profiles: ["series"]

  decompose:
    build:
      context: ./SERVICES/series_temporelles/2_Decompose
      dockerfile: Dockerfile.decompose.ST
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./exports:/app/exports
      - ./SERVICES:/app/services
    command: ["python","/app/services/series_temporelles/2_Decompose/seasonal_decomp.py",
          "--input-folder","/app/exports/st",
          "--output-folder","/app/exports/st"]
    env_file:
      - .env
    environment:
      - RUN_MODE=full
      - ST_SUFFIX=${ST_SUFFIX:-q12}
    networks:
      - ml_net
    profiles: ["series"]

  train_sarimax:
    build:
      context: ./SERVICES/series_temporelles/3_SARIMAX
      dockerfile: Dockerfile.sarimax.ST
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./exports:/app/exports
      - ./SERVICES:/app/services
    command: ["python","/app/services/series_temporelles/3_SARIMAX/sarimax_api.py",
          "--input-folder","/app/exports/st",
          "--output-folder","/app/exports/st"]
    env_file:
      - .env
    environment:
      - RUN_MODE=full
      - ST_SUFFIX=${ST_SUFFIX:-q12}
    networks:
      - ml_net
    profiles: ["series"]

  evaluate:
    build:
      context: ./SERVICES/series_temporelles/4_EVALUATE
      dockerfile: Dockerfile.evaluate.ST
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./exports:/app/exports
      - ./SERVICES:/app/services
      - ./data:/app/data
    entrypoint: ["python", "/app/services/series_temporelles/4_EVALUATE/evaluate_ST.py"]
    env_file:
      - .env
    environment:
      - RUN_MODE=full
      - ST_SUFFIX=${ST_SUFFIX:-q12}
    networks:
      - ml_net
    profiles: ["series"]

  series_pipeline:
    build:
      context: ./SERVICES/series_temporelles
      dockerfile: Dockerfile.series_pipeline
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./SERVICES:/app/services
      - ./data:/app/data
      - ./exports:/app/exports
    command: ["python", "/app/services/series_temporelles/pipeline.py", "--help"]
    env_file:
      - .env
    networks:
      - ml_net
    profiles: ["series"]

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9090:9090"
    volumes:
      - ./SERVICES/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./SERVICES/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - ml_net
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./SERVICES/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./SERVICES/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - ml_net
    profiles: ["monitoring"]

  alertmanager:
    image: prom/alertmanager:v0.25.0
    ports:
      - "9093:9093"
    volumes:
      - ./SERVICES/monitoring/alertmanager.yml:/etc/alertmanager/config.yml
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks:
      - ml_net
    profiles: ["monitoring"]

  jaeger:
    image: jaegertracing/all-in-one:1.41
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - ml_net
    profiles: ["monitoring"]

  locust:
    image: locustio/locust:2.15.1
    ports:
      - "8089:8089"
    volumes:
      - ./SERVICES/monitoring/locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --host=http://api:8000
    networks:
      - ml_net
    profiles: ["monitoring"]

# Définir les volumes une seule fois à la racine
volumes:
  postgres_data:
  mlflow_artifacts:
  grafana_data:

# Définir les networks une seule fois à la racine
networks:
  ml_net:
    driver: bridge

